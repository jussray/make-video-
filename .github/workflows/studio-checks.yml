name: MakeVideo studio checks

on:
  push:
    branches: [main, fix/makevideo-canonical-migration]
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/studio-checks.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'e2e/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/studio-checks.yml'
permissions:
  contents: read
jobs:
  static-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -s dist/index.html && test -s dist/assets/recording.js
      - name: Install browser testing runtime
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.61.1
          npx playwright install --with-deps chromium
      - name: Prepare audio-track probe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Verify actual mobile UI and WebM seeking with Playwright
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/makevideo-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ >/dev/null
          npx playwright test e2e/makevideo.spec.js --browser chromium --reporter=line

