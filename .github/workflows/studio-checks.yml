name: MakeVideo studio checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/studio-checks.yml'
  pull_request:
    paths:
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/studio-checks.yml'
permissions:
  contents: read
jobs:
  static-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: test -s dist/index.html && test -s dist/assets/recording.js
