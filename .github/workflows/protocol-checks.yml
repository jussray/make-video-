name: MAKEVIDEO protocol checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'demo.py'
      - '.github/workflows/protocol-checks.yml'
  push:
    branches:
      - 'export/make-video-contract'
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'demo.py'
      - '.github/workflows/protocol-checks.yml'
jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s test -p 'test_demo.py' -v
