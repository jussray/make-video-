name: MAKEVIDEO protocol checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/protocol-checks.yml'
  push:
    branches:
      - 'export/make-video-contract'
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/protocol-checks.yml'
jobs:
  protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
